# 震荡盘专用 —— 价量因子版（回测优于加估值后的版本）
# 用法: python run_backtest.py config_choppy.yaml
#      python run_signals.py config_choppy.yaml
# 部署前提: python run_regime_check.py 显示「震荡」

universe:
  min_list_days: 120
  min_avg_amount: 5000000
  min_total_mv: 2000000000
  exclude_st: true

data:
  start_date: "2021-01-01"
  end_date: null
  cache_dir: "data"
  adjust: "hfq"

# 回归「改之前」价量组合：小市值 + 动量 + 低波 + 低换手
# 不接 PE/ROE —— 震荡盘样本里收益更高
factors:
  use_valuation: false
  weights:
    ln_mv: -1.0
    momentum_20: 0.55
    volatility_20: -0.45
    turnover_20: -0.50
    ep: 0.0
    roe: 0.0
  winsorize: 0.02

portfolio:
  n_stocks: 25
  weight: "equal"
  rebalance: "month_end"

cost:
  commission: 0.00025
  stamp_duty: 0.0005
  slippage: 0.0015

risk:
  drawdown_reduce: 0.15
  drawdown_halt: 0.20

backtest:
  start_date: "2021-01-01"
  end_date: null
  benchmark: "000300"
  max_stocks: null         # 全市场
  only_regime: "震荡"
